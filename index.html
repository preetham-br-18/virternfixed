<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        function shouldSuppress(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : ((err && err.message) ? err.message : '');
          return msg.indexOf("reading 'indexOf'") !== -1 || msg.indexOf("undefined (reading 'indexOf')") !== -1;
        }
        window.addEventListener('error', function(e) {
          if (shouldSuppress(e && (e.error || e.message))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (shouldSuppress(e && (e.reason || e.detail))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
